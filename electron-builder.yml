appId: com.newapp.backup
productName: NewApp Backup
directories:
  output: release
icon: resources/icon.png
win:
  sign: false
  target:
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-Portable-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.exe
  requestExecutionLevel: user
